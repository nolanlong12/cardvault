function exMatch(c){
 if(c.sec&&!S.disc[c.id])return false;
 const s=exS(c),q=EX.q.trim().toLowerCase(),left=exLeft(c,s),v=S.pr[c.id]||0;
 if(EX.rar!==''&&c.r!=+EX.rar)return false;

 if(q){
  const hay=(c.n+' '+c.set+' '+RN[c.r]+' '+(c.ab||'')+' '+(c.pr==1||c.one?'1 of 1 one of one':'')).toLowerCase();
  const byNo=/^\d{1,4}$/.test(q)&&(c.id+1==+q||c.id==+q);

function quickOpen(k,n){const p=P[k],have=S.sealed[k]||0,cost=Math.max(0,n-have)*p.price;
 if(S.money<cost)return toast('You need '+$$$(cost)+' to open '+n+' (you have '+$$$(S.money)+')',3500);
 modal(`<h2 style="margin:0">Open ${n} × ${p.n}</h2><p>${have?`Uses ${Math.min(have,n)} you already own. `:''}Cost: <b>${$$$(cost)}</b>. All cards go straight to your binder and you see one summary.</p>
 <div class="row"><button id="qn">Normal</button><button id="qh" style="background:#dc2626;border-color:#dc2626;color:#fff">Hard</button><button class="g" id="qc">Cancel</button></div>`);
 $$('qc').onclick=closeM;$$('qn').onclick=()=>runQuick(k,n,'normal');$$('qh').onclick=()=>runQuick(k,n,'hard')}
async function runQuick(k,n,mode){const p=P[k];modal(`<h2 style="margin:0">Opening…</h2><p class="mt" id="qp">0 / ${n}</p>`);LASTMODE=mode;
 const got=[];let done=0;
 try{for(let i=0;i<n;i++){
   if(!(S.sealed[k]>0)){await rpc('buy_product',{p_key:k});S.money-=p.price;S.sealed[k]=(S.sealed[k]||0)+1}
   const packs=await rpc('open_product',{p_key:k,p_mode:mode});S.sealed[k]--;
   packs.forEach(pk=>pk.forEach(c=>{c.h=c.h||[];c.m=+c.m;S.inv.push(c);S.disc[c.cid]=1;got.push(c)}));
   logH(packs,p.n);S.xp+=10;S.st.open++;done++;const q=$$('qp');if(q)q.textContent=done+' / '+n}}catch(e){}
 try{await resync()}catch(_){}
 const top=[...got].sort((a,b)=>val(b)-val(a)),tv=got.reduce((a,c)=>a+val(c),0),sell=got.filter(c=>S.inv.includes(c)&&card(c).r<2);
 modal(`<h2 style="margin:0">Opened ${done} × ${p.n}</h2><p>${got.length} cards · worth <b>${$$$(tv)}</b>${done<n?` <span style="color:#fbbf24">(stopped early: ${n-done} not opened)</span>`:''}</p>
  <h3 style="margin:6px 0">Best pulls</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr))">${top.slice(0,12).map(c=>cardH(c)).join('')}</div>
  <div class="row" style="margin-top:12px"><button id="qd">Done</button><button class="g" id="qa">🔁 Open ${n} more</button>${sell.length?`<button class="g" id="qs">Sell ${sell.length} Common/Uncommon (${$$$(sell.reduce((a,c)=>a+val(c)*.95,0))})</button>`:''}</div>`);
 $$('qd').onclick=()=>{closeM();draw()};$$('qa').onclick=()=>{closeM();quickOpen(k,n)};
 const qs=$$('qs');if(qs)qs.onclick=()=>{const ids=sell.map(c=>c.uid);closeM();BNC(sell,sell.reduce((a,c)=>a+val(c),0),sell.reduce((a,c)=>a+Math.round(val(c)*.95*100)/100,0),bnWarn(sell))}}

/* --- Binder: Sell duplicates / Sell under $X --- */
const _bnQ=binder;binder=function(m,k){_bnQ(m,k);
 const bar=$$('bsel');if(!bar)return;const host=bar.parentElement;
 host.insertAdjacentHTML('beforeend','<button class="g" id="bdup">♻ Sell duplicates</button><button class="g" id="bund">💲 Sell under $…</button>');
 const ok=i=>eligible(i)&&!protectedBy(i)&&!i.show&&!i.fav;
 $$('bdup').onclick=()=>{const by={};S.inv.forEach(i=>{(by[i.cid]=by[i.cid]||[]).push(i)});const list=[];
  Object.values(by).forEach(g=>{if(g.length<2)return;g.sort((a,b)=>val(b)-val(a)||((a.sr||9e9)-(b.sr||9e9)));g.slice(1).forEach(i=>{if(ok(i))list.push(i)})});
  if(!list.length)return toast('No duplicates to sell (protected, equipped or locked cards are kept)',3500);
  BNC(list,list.reduce((a,i)=>a+val(i),0),list.reduce((a,i)=>a+Math.round(val(i)*.95*100)/100,0),bnWarn(list))};
 $$('bund').onclick=()=>{modal(`<h2 style="margin:0">Sell cards worth less than…</h2><p class="mt">Keeps protected, equipped, locked and trophy cards.</p><div class="row"><input id="bux" type="number" min="1" value="100" style="background:var(--pn);color:var(--tx);border:1px solid var(--pn2);border-radius:8px;padding:8px;width:130px"><button id="buk">Review</button><button class="g" id="buc">Cancel</button></div>`);
  $$('buc').onclick=closeM;$$('buk').onclick=()=>{const x=+$$('bux').value;closeM();if(!(x>0))return;const list=S.inv.filter(i=>ok(i)&&val(i)<x).slice(0,1000);
   if(!list.length)return toast('No cards under '+$$$(x)+' that can be sold',3000);
   BNC(list,list.reduce((a,i)=>a+val(i),0),list.reduce((a,i)=>a+Math.round(val(i)*.95*100)/100,0),bnWarn(list))}}};
}

</script></body></html>
