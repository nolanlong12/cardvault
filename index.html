  <div class="mt" style="margin-top:6px">YOU ASKED FOR · worth ${$$$(tTot(t.ac,t.am))}</div>${tSide(t.ac,t.am)}
  <div class="row" style="margin-top:8px"><button class="g" data-tc="${t.id}">Cancel offer</button></div></div>`).join('')||'<p class="mt">You have no pending offers.</p>')+
 `<h3>Recent trades</h3>`+(d.history.map(t=>{const gave=t.mine?tTxt(t.oc,t.om):tTxt(t.ac,t.am),got=t.mine?tTxt(t.ac,t.am):tTxt(t.oc,t.om);
  return`<div class="pn" style="padding:8px 12px"><b>${st[t.status]||t.status}</b> · ${t.mine?'to '+esc(t.to):'from '+esc(t.from)}<div class="mt" style="font-size:13px">You gave: ${esc(gave)}<br>You got: ${esc(got)}</div></div>`}).join('')||'<p class="mt">No finished trades yet.</p>')}

trades=function(m,skip){
 if(!READY){m.innerHTML=`<h2 style="margin-top:0">Trades</h2><p class="mt">Sign in to trade with other players.</p>`;return}
 m.innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Trades</h2><button id="tn">🤝 Make Trade</button></div>
 <p class="mt">Trade cards and cash with another player. Both of you confirm before anything moves. Offers last 48 hours, and what you offer is held safely until then.</p>`+(TR.d?trBody(TR.d):'<p class="mt">Loading…</p>');
 $$('tn').onclick=tbOpen;
 m.querySelectorAll('[data-ta]').forEach(b=>b.onclick=()=>{const t=TR.d.pending.find(x=>x.id==b.dataset.ta);if(t)trConfirm(t)});
 m.querySelectorAll('[data-td]').forEach(b=>b.onclick=()=>{b.disabled=true;trAct(+b.dataset.td,'decline')});
 m.querySelectorAll('[data-tc]').forEach(b=>b.onclick=()=>{b.disabled=true;trAct(+b.dataset.tc,'cancel')});
 if(!skip)trLoad()};

function trConfirm(t){modal(`<h2 style="margin-top:0">Accept trade with ${esc(t.from)}?</h2>
 <div class="mt">YOU GET · worth ${$$$(tTot(t.oc,t.om))}</div>${tSide(t.oc,t.om)}
 <div class="mt" style="margin-top:8px">YOU GIVE · worth ${$$$(tTot(t.ac,t.am))}</div>${tSide(t.ac,t.am)}
 <p class="mt">Values are estimates and move with the market. A finished trade cannot be undone.</p>
 <div class="row"><button id="ty">Confirm trade</button><button class="g" id="tx">Not now</button></div>`);
 $$('tx').onclick=closeM;$$('ty').onclick=()=>{$$('ty').disabled=true;trAct(t.id,'accept')}}
async function trAct(id,a){closeM();let msg;try{msg=await rpc('trade_respond',{p_id:id,p_action:a})}catch(e){await trLoad(true);return}
 toast(msg,3000);await resync();await trLoad(true)}

/* ---- Make Trade window ---- */
let TB={};
function tbOpen(){TB={u:null,theirs:[],mine:[],give:new Set(),ask:new Set(),gm:0,am:0,f1:'',f2:''};tbSearch()}
function tbSearch(){
 modal(`<h2 style="margin-top:0">🤝 Make Trade</h2><p class="mt">Search for a player by username.</p>
 <input id="tq" placeholder="Username (at least 2 letters)" autocomplete="off" style="width:100%"><div id="tres" style="margin-top:8px"></div>
 <div class="row" style="margin-top:10px"><button class="g" id="tx">Close</button></div>`);
 $$('tx').onclick=closeM;const q=$$('tq');let tmr;q.focus();
 q.oninput=()=>{clearTimeout(tmr);tmr=setTimeout(async()=>{const v=q.value.trim(),r=$$('tres');if(!r)return;if(v.length<2){r.innerHTML='';return}
  let u;try{u=await rpc('trade_find_user',{p_q:v},1)}catch(e){return}if(!$$('tq')||q.value.trim()!==v)return;
  r.innerHTML=(u||[]).map(x=>`<button class="g" data-u="${x.id}" data-n="${esc(x.username)}" style="display:block;width:100%;margin:4px 0;text-align:left">👤 ${esc(x.username)}</button>`).join('')||'<p class="mt">No player found.</p>';
  r.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>tbPick(b.dataset.u,b.dataset.n))},300)}}
async function tbPick(id,name){modal(`<p class="mt">Loading ${esc(name)}'s cards…</p>`);let cs;
 try{cs=await rpc('trade_user_cards',{p_user:id})}catch(e){return tbSearch()}
 cs.forEach(c=>{c.m=+c.m;c.val=+c.val});TB.u={id,name};TB.theirs=cs;TB.give=new Set();TB.ask=new Set();TB.gm=0;TB.am=0;TB.f1='';TB.f2='';tbBuild()}
function tbRows(arr,set,filt,k){const q=filt.toLowerCase();
 return arr.filter(c=>CARDS[c.cid]&&(!q||CARDS[c.cid].n.toLowerCase().includes(q))).slice(0,150).map(c=>`<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" data-k="${k}" data-u="${c.uid}" ${set.has(c.uid)?'checked':''}><div style="flex:1;min-width:0">${tcard(c)}</div></label>`).join('')||'<span class="mt">No cards to show.</span>'}
function tbSum(){const g=TB.mine.filter(c=>TB.give.has(c.uid)),a=TB.theirs.filter(c=>TB.ask.has(c.uid)),gm=+($$('gm').value||0)||0,am=+($$('am').value||0)||0,
  gv=tTot(g,gm),av=tTot(a,am),el=$$('tsum');
 el.innerHTML=`You give about <b>${$$$(gv)}</b> · You get about <b>${$$$(av)}</b>`+(gv>0&&av>0?` <span class="${av>=gv?'up':'dn'}">(${av>=gv?'+':''}${((av/gv-1)*100).toFixed(0)}% for you)</span>`:'')}
function tbBuild(){const avail=Math.max(0,S.money-(S.held||0));
 TB.mine=S.inv.filter(i=>!i.lock&&!i.listed&&!i.tr&&!inSlot(i.uid)).sort((a,b)=>val(b)-val(a));
 modal(`<h2 style="margin-top:0">Trade with ${esc(TB.u.name)}</h2>
 <div class="pn"><b>YOU GIVE</b> <span class="mt">(up to 10 cards)</span>
  <input id="f1" placeholder="Filter your cards" style="width:100%;margin:6px 0" value="${esc(TB.f1)}"><div id="l1" style="max-height:24vh;overflow:auto"></div>
  <div class="row" style="margin-top:6px">💵 Cash <input id="gm" type="number" min="0" step="0.01" placeholder="0" style="width:130px" value="${TB.gm||''}"><span class="mt">available ${m2(avail)}</span></div></div>
 <div class="pn"><b>YOU ASK FOR</b> <span class="mt">(up to 10 cards from ${esc(TB.u.name)})</span>
  <input id="f2" placeholder="Filter their cards" style="width:100%;margin:6px 0" value="${esc(TB.f2)}"><div id="l2" style="max-height:24vh;overflow:auto"></div>
  <div class="row" style="margin-top:6px">💵 Cash <input id="am" type="number" min="0" step="0.01" placeholder="0" style="width:130px" value="${TB.am||''}"></div></div>
 <div id="tsum" class="mt" style="margin:8px 0"></div>
 <div class="row"><button id="tgo">Review offer</button><button class="g" id="tback">Pick another player</button><button class="g" id="tx">Cancel</button></div>`);
 const l1=$$('l1'),l2=$$('l2');l1.innerHTML=tbRows(TB.mine,TB.give,TB.f1,'g');l2.innerHTML=tbRows(TB.theirs,TB.ask,TB.f2,'a');tbSum();
 const chg=e=>{const t=e.target;if(!t.dataset.u)return;const s=t.dataset.k=='g'?TB.give:TB.ask;
  if(t.checked){if(s.size>=10){t.checked=false;return toast('Up to 10 cards per side')}s.add(t.dataset.u)}else s.delete(t.dataset.u);tbSum()};
 l1.onchange=chg;l2.onchange=chg;
 $$('f1').oninput=e=>{TB.f1=e.target.value;l1.innerHTML=tbRows(TB.mine,TB.give,TB.f1,'g')};
 $$('f2').oninput=e=>{TB.f2=e.target.value;l2.innerHTML=tbRows(TB.theirs,TB.ask,TB.f2,'a')};
 $$('gm').oninput=tbSum;$$('am').oninput=tbSum;
 $$('tx').onclick=closeM;$$('tback').onclick=tbSearch;
 $$('tgo').onclick=()=>{const gm=Math.max(0,+((+$$('gm').value||0).toFixed(2))),am=Math.max(0,+((+$$('am').value||0).toFixed(2)));
  if(!TB.give.size&&gm<=0)return toast('Offer at least one card or some cash');
  if(gm>avail)return toast('You only have '+m2(avail)+' available');
  TB.gm=gm;TB.am=am;tbReview()}}
function tbReview(){const g=TB.mine.filter(c=>TB.give.has(c.uid)),a=TB.theirs.filter(c=>TB.ask.has(c.uid)),nm=esc(TB.u.name);
 modal(`<h2 style="margin-top:0">Send this offer to ${nm}?</h2>
 <div class="mt">YOU GIVE · worth ${$$$(tTot(g,TB.gm))}</div>${tSide(g,TB.gm)}
 <div class="mt" style="margin-top:8px">YOU GET · worth ${$$$(tTot(a,TB.am))}</div>${tSide(a,TB.am)}
 ${!a.length&&!(TB.am>0)?'<p class="dn">⚠ You are asking for nothing in return.</p>':''}
 <p class="mt">What you offer is held until ${nm} answers or 48 hours pass. ${nm} has to confirm before anything moves.</p>
 <div class="row"><button id="tsend">Send offer</button><button class="g" id="tedit">Edit</button></div>`);
 $$('tedit').onclick=tbBuild;
 $$('tsend').onclick=async()=>{const b=$$('tsend');b.disabled=true;
  try{await rpc('trade_create',{p_to:TB.u.id,p_offer:[...TB.give],p_offer_money:TB.gm,p_ask:[...TB.ask],p_ask_money:TB.am})}catch(e){b.disabled=false;return}
  closeM();toast('Offer sent to '+TB.u.name,3000);await resync();await trLoad(true)}}

/* cards held in a trade show a trade label instead of the auction label */
const _cardHT=cardH;cardH=function(i,x,nc){const h=_cardHT(i,x,nc);return i.tr?h.replace('🏛 LISTED · ','🤝 IN TRADE · '):h};
const _detailT=detail;detail=function(...a){_detailT(...a);const i=S.inv.find(x=>x.uid==a[0]);
 if(i&&i.tr)$$('md').querySelectorAll('.tag').forEach(e=>{if(/LISTED ON AUCTION/.test(e.textContent))e.textContent='🤝 HELD IN A PENDING TRADE'})};

</script></body></html>
